<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spring Boot Web Upload and Resize Images</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h4 mb-4">Choose an image file to upload and resize</h1>

                    <div class="alert alert-danger" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                    <div class="alert alert-success" role="alert" th:if="${successMessage}"
                         th:text="${successMessage}"></div>

                    <form enctype="multipart/form-data" method="post" th:action="@{/uploadImage}">
                        <div class="mb-3">
                            <label class="form-label" for="image">File to upload</label>
                            <input accept="image/png,image/jpeg,image/gif,image/bmp" class="form-control" id="image"
                                   name="image" required type="file">
                            <div class="form-text">Supported formats: JPG, PNG, GIF, BMP. Max size 16MB.</div>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Upload &amp; Resize</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
