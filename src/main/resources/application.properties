spring.application.name=spring-boot-upload-resize
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB
server.servlet.session.tracking-modes=cookie
image.folder=${IMAGE_FOLDER:${user.home}/Images}
image.size=400

# Actuator: expose only the health endpoint (used by Docker/Kubernetes health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,imageFolder
